<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Opportunity</title>
<meta name="description" content="Build NASA's Opportunity rover and explore her Mars mission in an interactive browser story.">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-phase="build" data-input="hardware">
<main id="stage">
<div id="pano" aria-hidden="true"><i></i><i></i></div>
<svg id="ill" viewBox="0 0 640 360" role="img" aria-label="Side view of the Opportunity rover as it is assembled">
<rect y="300" width="640" height="1" fill="var(--line)"/>
<g id="rover" class="dusty">
  <g class="base" id="base-body"><rect class="metal" x="200" y="172" width="250" height="62" rx="2"/><rect class="dk" x="216" y="186" width="60" height="30" opacity=".35"/><circle cx="420" cy="203" r="6" class="dk"/></g>
  <g class="part" id="p-wheels">
    <polyline class="line" points="300,232 175,276 300,276"/><polyline class="line" points="400,232 470,276"/><polyline class="line" points="300,232 400,232"/>
    <g class="wheel"><circle cx="175" cy="272" r="32" class="metal"/><circle cx="175" cy="272" r="11" class="dk"/><path d="M175 244v56M147 272h56" stroke="var(--dark)" stroke-width="3"/></g>
    <g class="wheel"><circle cx="300" cy="272" r="32" class="metal"/><circle cx="300" cy="272" r="11" class="dk"/><path d="M300 244v56M272 272h56" stroke="var(--dark)" stroke-width="3"/></g>
    <g class="wheel"><circle cx="470" cy="272" r="32" class="metal"/><circle cx="470" cy="272" r="11" class="dk"/><path d="M470 244v56M442 272h56" stroke="var(--dark)" stroke-width="3"/></g>
  </g>
  <g class="part" id="p-solar"><polygon points="188,170 452,170 496,146 232,146" class="cell"/><path d="M254 146L210 170M276 146L232 170M298 146L254 170M320 146L276 170M342 146L298 170M364 146L320 170M386 146L342 170M408 146L364 170M430 146L386 170M452 146L408 170M474 146L430 170" stroke="#5b74a8" stroke-width="1" opacity=".7"/></g>
  <g class="part" id="p-camera"><path class="line" d="M340 148V62" style="stroke-width:8"/><rect class="metal" x="316" y="36" width="64" height="28" rx="2"/><circle class="lens" cx="334" cy="50" r="7"/><circle class="lens" cx="362" cy="50" r="7"/></g>
  <g class="part" id="p-arm"><polyline class="line" points="448,205 506,226 548,262" style="stroke-width:9"/><circle cx="548" cy="264" r="15" class="metal"/><circle cx="548" cy="264" r="5" class="dk"/><circle cx="562" cy="276" r="5" fill="var(--mars)"/></g>
  <g class="base" id="base-antenna"><path class="line" d="M236 148V104" style="stroke-width:5"/><ellipse cx="236" cy="96" rx="30" ry="10" class="metal" transform="rotate(-22 236 96)"/></g>
</g>
</svg>
<div id="gl"></div>
<div id="haze"></div>

<p id="mark"><b data-ui="title"></b><span data-ui="sub"></span></p>
<div id="intro"><p class="cursor" data-ui="intro"></p><p class="keys" data-ui="introKeys"></p></div>
<section id="parts" aria-label="Rover parts" hidden>
  <p class="lbl">Choose a part to inspect</p>
  <div id="partChoices"></div>
</section>
<aside id="tab" class="unfold" aria-live="polite">
<i class="rule"></i>
<div class="body frame">
<div id="tabHead"></div>
<div id="tabgl"><p class="lbl" data-ui="dragHint"></p></div>
<div id="tabInfo"></div>
<button id="add" type="button" data-ui="add"></button>
</div>
</aside>

<div id="wakebox" class="ov frame"><p class="lbl" data-ui="wakeLbl"></p><button id="wakeBtn" type="button" data-ui="wake"></button></div>

<div id="rewind" class="ov" aria-live="polite">
<p class="lbl" id="rwLbl"></p>
<p id="rwDate"></p>
<div id="rwTrack"><div id="rwStrip"></div></div>
</div>

<button id="prev" class="arrow ov" type="button" data-aria="prev">‹</button>
<button id="next" class="arrow ov" type="button" data-aria="next">›</button>
<div id="nav" class="frame ov"><p class="lbl" data-ui="navHead"></p>
<svg viewBox="10 0 380 390" preserveAspectRatio="xMinYMin slice" role="img" aria-label="Map of Opportunity's route across Meridiani Planum">
<image href="assets/img/traverse.jpg" width="550" height="390"/><polyline id="route"/><polyline id="trail"/><g id="dot"><rect x="-5" y="-5" width="10" height="10"/></g>
</svg><p id="where"></p></div>
<section id="slide" class="unfold ov" aria-live="polite"><i class="rule"></i><div class="body frame" id="slBody"></div></section>

<div id="ending" class="ov"><h2 data-ui="endTitle"></h2><p class="when" data-ui="endDates"></p><p data-ui="epitaph"></p><button id="again" type="button" data-ui="again"></button><button id="galBtn" class="ghost" type="button" data-ui="gallery"></button></div>

<aside id="photo" class="unfold" aria-live="polite">
<i class="rule"></i>
<div class="body frame">
<div id="phImg"></div>
<div id="phHead"></div>
<p id="phNav"><button class="ghost" id="phPrev" type="button" data-aria="prev">‹</button><button class="ghost" id="phNext" type="button" data-aria="next">›</button></p>
<button id="phClose" type="button"></button>
</div>
</aside>

<footer id="telemetry">
<span>MER-B</span><span id="tParts"></span><span id="tState"></span><span id="tSol"></span>
<span id="edition" role="group" aria-label="Input edition"><button id="hardwareMode" class="text active" type="button" aria-pressed="true">Hardware</button><button id="browserMode" class="text" type="button" aria-pressed="false">Browser</button></span>
<span id="hardwareStatus"><span id="plat" aria-live="polite">Platform not connected</span> <button class="text" id="connect" type="button">Connect</button></span>
<span class="credit" data-ui="tCredit"></span>
</footer>

<section id="tools" hidden aria-label="Model tools">
<h3 data-ui="tools"></h3>
<p><button class="ghost" id="pick" type="button">Load a different .glb</button><input type="file" id="file" accept=".glb,.gltf" hidden> <button class="ghost" id="toggle" type="button" hidden>Show illustration</button></p>
<p id="msg">Loading NASA 3D model…</p>
<details id="map" hidden><summary>Model mapping</summary><pre id="maptxt"></pre></details>
<div id="dev" hidden>
<h3>RFID tags</h3>
<ul id="tags"></ul>
<p>Assign unknown tags to rover parts:</p><pre id="saved"></pre>
<button class="ghost" id="clearTags" type="button">Forget assigned tags</button>
<p>Last serial lines:</p><pre id="rawlog"></pre>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/input.js"></script>
</body>
</html>
